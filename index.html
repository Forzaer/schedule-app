<style>
:root{
  --bg:#07090f;--text:#eef2ff;--text-2:rgba(226,232,255,.68);--text-3:rgba(226,232,255,.44);
  --card-1:rgba(255,255,255,.085);--card-2:rgba(255,255,255,.03);--card-solid:#11152a;
  --stroke:rgba(255,255,255,.10);--stroke-2:rgba(255,255,255,.18);--hi:rgba(255,255,255,.08);
  --shadow:0 8px 28px -14px rgba(0,0,0,.8);
  --accent:#7c5cff;--accent-2:#22d3ee;--glow-2:#22d3ee;--grid:rgba(255,255,255,.04);
  --g1:rgba(91,61,255,.55);--g2:rgba(0,170,255,.38);--g3:rgba(255,61,154,.26);
  --lec:#34d399;--lec-rgb:52,211,153;--prac:#fbbf24;--prac-rgb:251,191,36;
  --lab:#a78bfa;--lab-rgb:167,139,250;--other:#60a5fa;--other-rgb:96,165,250;
  --r-lg:22px;--r-md:16px;
  --safe-top:0px;--safe-bottom:0px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Roboto Mono",Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#eef1fb;--text:#0d1226;--text-2:rgba(13,18,38,.68);--text-3:rgba(13,18,38,.45);
  --card-1:rgba(255,255,255,.72);--card-2:rgba(255,255,255,.38);--card-solid:#ffffff;--accent-2:#0e7490;
  --stroke:rgba(20,30,80,.10);--stroke-2:rgba(20,30,80,.18);--hi:rgba(255,255,255,.7);
  --shadow:0 8px 26px -16px rgba(40,50,120,.45);--grid:rgba(20,30,90,.05);
  --g1:rgba(91,61,255,.30);--g2:rgba(0,170,255,.26);--g3:rgba(255,61,154,.18);
  --lec:#047857;--lec-rgb:4,120,87;--prac:#b45309;--prac-rgb:180,83,9;
  --lab:#7c3aed;--lab-rgb:124,58,237;--other:#2563eb;--other-rgb:37,99,235;
}
@supports (padding:env(safe-area-inset-top,0px)){:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}}
@supports (padding:max(0px,1px)){:root{
  --safe-top:calc(max(env(safe-area-inset-top,0px),var(--tg-sa-top,0px)) + var(--tg-top,0px));
  --safe-bottom:calc(max(env(safe-area-inset-bottom,0px),var(--tg-sa-bottom,0px)) + var(--tg-bottom,0px))}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}

/* Фон: статичные градиенты и сетка, без blur-фильтров (дёшево для GPU) */
.bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 0 0,var(--g1),transparent 55%),
             radial-gradient(circle at 100% 100%,var(--g2),transparent 55%),
             radial-gradient(circle at 85% 45%,var(--g3),transparent 40%)}
.bg:before{content:"";position:absolute;top:-10%;left:-10%;width:120%;height:120%;will-change:transform;
  background:radial-gradient(circle at 30% 30%,var(--g1),transparent 32%),radial-gradient(circle at 70% 75%,var(--g2),transparent 30%);
  opacity:.55;animation:aurora 26s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(6%,-5%,0) scale(1.08)}}
.paused .bg:before,.paused .live:before{animation-play-state:paused}
.bg:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 25%,transparent 75%);
  mask-image:radial-gradient(ellipse at 50% 25%,#000 25%,transparent 75%)}

/* «Стекло» без backdrop-filter: полупрозрачный градиент, тонкая рамка и блик сверху */
.glass{background:linear-gradient(150deg,var(--card-1),var(--card-2));border:1px solid var(--stroke);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}

.screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;display:flex;flex-direction:column;
  padding:14px 16px 0;padding-top:calc(var(--safe-top) + 14px);transition:opacity .25s ease,visibility 0s}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s .25s}

/* Выбор группы */
.picker{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px;padding-bottom:calc(var(--safe-bottom) + 24px)}
.brand{display:flex;align-items:center;margin:8px 0 26px}
.logo{margin-right:10px}
.logo{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--glow-2));box-shadow:0 0 22px -4px var(--accent)}
.logo svg{width:22px;height:22px}
.brand b{font-size:17px}
.brand small{display:block;color:var(--text-3);font:11px var(--mono);letter-spacing:.8px}
.hero h1{font-size:31px;line-height:1.08;margin:0 0 8px;font-weight:800;letter-spacing:-.5px}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 22px;color:var(--text-2)}
.groups{display:grid;gap:12px}
.group-card{position:relative;display:flex;align-items:center;padding:16px;border-radius:var(--r-lg);overflow:hidden;
  transition:transform .15s ease;animation:rise .35s ease backwards}
.group-card:active{transform:scale(.98)}
.group-card:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:50%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);animation:sheen 1.1s .4s ease-out backwards}
@keyframes sheen{from{transform:translateX(0)}to{transform:translateX(420%)}}
.group-card .badge{margin-right:14px}.group-card .chev{margin-left:14px}
.group-card .badge{flex:none;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font:700 13px var(--mono);background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.25));border:1px solid var(--stroke-2)}
.group-card .meta{flex:1;min-width:0}
.group-card .meta b{display:block;font-size:18px}
.group-card .meta span{display:block;color:var(--text-2);font-size:13px;margin-top:2px}
.group-card .meta em{display:inline-block;margin-top:8px;font:normal 11px var(--mono);color:var(--accent-2);
  padding:3px 8px;border-radius:99px;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.3)}
.group-card .chev{color:var(--text-3);flex:none}
.group-card.current{border-color:rgba(124,92,255,.65)}
.ver{margin-top:22px;text-align:center;font:11px var(--mono);color:var(--text-3)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.boot .screen{transition:none!important}
.lite .bg:before{animation:none;will-change:auto}

/* Расписание */
.topbar{display:flex;align-items:center}
.chip{display:flex;align-items:center;padding:6px 12px 6px 6px;border-radius:99px;min-width:0}
.chip .dot{margin-right:8px}.chip svg{margin-left:8px}
.chip .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--glow-2));font-size:11px;font-weight:800;color:#fff}
.chip b{font-size:15px;white-space:nowrap}
.chip svg{opacity:.6;flex:none}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:19px;height:19px}
.week-head{display:flex;align-items:center;margin:16px 0 12px}
.week-head>*+*{margin-left:8px}
.week-head .title{flex:1;min-width:0}
.week-head .title b{display:block;font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-head .title small{display:block;font:11px var(--mono);color:var(--text-3);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-btn{padding:8px 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--accent-2)}
.today-btn[hidden]{display:none}
:root[data-theme="light"] .today-btn{color:var(--accent)}

.week-strip{position:relative;display:flex;padding:6px;border-radius:20px}
.day-btn+.day-btn{margin-left:4px}
.day-btn{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 9px;border-radius:14px;text-align:center}
.day-btn .dw{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase}
.day-btn .dn{font:700 17px var(--mono);margin-top:2px}
.day-btn .pips{display:flex;height:4px;margin-top:4px}
.pips i+i{margin-left:2px}
.day-btn .pips i{width:4px;height:4px;border-radius:50%;background:var(--text-3)}
.pips .lec{background:var(--lec)!important}.pips .prac{background:var(--prac)!important}
.pips .lab{background:var(--lab)!important}.pips .other{background:var(--other)!important}
.day-btn.is-today .dn{color:var(--accent-2)}
.day-btn.is-today:before{content:"";position:absolute;top:5px;right:50%;margin-right:-16px;width:5px;height:5px;border-radius:50%;background:var(--accent-2);animation:pulse 2s ease-in-out 3}
@keyframes pulse{50%{opacity:.3}}
.day-btn.active .dw,.day-btn.active .dn{color:#fff}
.day-btn.active .pips i{background:rgba(255,255,255,.85)!important}
.indicator{position:absolute;z-index:0;top:6px;bottom:6px;left:0;width:0;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),#4f7bff 60%,var(--glow-2));
  box-shadow:0 6px 18px -6px var(--accent),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .35s cubic-bezier(.3,1.25,.5,1)}

.legend{display:flex;flex-wrap:wrap;margin:12px 4px 0;font-size:12px;color:var(--text-2)}
.legend span{display:flex;align-items:center;margin:0 14px 4px 0}
.legend i{width:8px;height:8px;border-radius:50%;margin-right:6px}

.viewport{position:relative;flex:1;margin:0 -16px;overflow:hidden;touch-action:pan-y}
.day-pane{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:12px 16px 28px;padding-bottom:calc(var(--safe-bottom) + 28px)}
.in-r{animation:inR .3s ease-out backwards}.in-l{animation:inL .3s ease-out backwards}
.out-l{animation:outL .22s ease-in both}.out-r{animation:outR .22s ease-in both}
@keyframes inR{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-30%);opacity:0}to{transform:none;opacity:1}}
@keyframes outL{to{transform:translateX(-30%);opacity:0}}
@keyframes outR{to{transform:translateX(30%);opacity:0}}

.day-summary{display:flex;align-items:baseline;justify-content:space-between;margin:4px 4px 12px;color:var(--text-2);font-size:13px}
.day-summary .mono{margin-left:8px}
.day-summary b{color:var(--text);font-size:15px}
.day-summary .mono{font:12px var(--mono);white-space:nowrap}
.lessons{display:grid;gap:10px}

.lesson{--c:var(--other);--c-rgb:var(--other-rgb);position:relative;display:flex;flex-wrap:wrap;width:100%;
  padding:14px 14px 14px 12px;border-radius:var(--r-lg);overflow:hidden;transition:transform .12s ease}
.lesson.lec{--c:var(--lec);--c-rgb:var(--lec-rgb)}.lesson.prac{--c:var(--prac);--c-rgb:var(--prac-rgb)}
.lesson.lab{--c:var(--lab);--c-rgb:var(--lab-rgb)}
.lesson:active{transform:scale(.985)}
.stagger .lesson,.stagger .empty{animation:rise .35s ease-out backwards}
.stagger .lesson:nth-child(2){animation-delay:.04s}.stagger .lesson:nth-child(3){animation-delay:.08s}
.stagger .lesson:nth-child(4){animation-delay:.12s}.stagger .lesson:nth-child(5){animation-delay:.16s}
.stagger .lesson:nth-child(n+6){animation-delay:.2s}
.lesson:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
.lesson:after{content:"";position:absolute;right:0;top:0;width:140px;height:140px;pointer-events:none;
  background:radial-gradient(circle at 100% 0,rgba(var(--c-rgb),.16),transparent 70%)}
.lesson .time{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:2px;font-family:var(--mono)}
.lesson .time .n{font-size:11px;color:var(--text-3)}
.lesson .time .s{font-size:15px;font-weight:700;margin-top:2px}
.lesson .time .e{font-size:12px;color:var(--text-3)}
.lesson .body{flex:1;min-width:0;padding-left:12px}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--c)}
.tag:before{content:"";width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--c)}
.lesson h3{margin:4px 0 6px;font-size:15.5px;line-height:1.28;font-weight:700;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info{display:flex;flex-wrap:wrap;color:var(--text-2);font-size:12.5px}
.info span{display:inline-flex;align-items:center;margin-right:12px}
.info svg{width:13px;height:13px;margin-right:4px;opacity:.75;flex:none}
.lesson.past{opacity:.5}
.lesson.now{border-color:rgba(var(--c-rgb),.6);box-shadow:var(--shadow),0 0 26px -8px rgba(var(--c-rgb),.7)}
.live{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:#0b1020;background:var(--c);padding:2px 7px 2px 16px;border-radius:99px;vertical-align:1px;position:relative}
.live:before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
:root[data-theme="light"] .live{color:#fff}
.progress{width:100%;height:4px;border-radius:4px;background:var(--stroke);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,rgba(var(--c-rgb),.55),var(--c))}
.progress-label{width:100%;display:flex;justify-content:space-between;font:11px var(--mono);color:var(--text-3);margin-top:6px}
.gap{display:flex;align-items:center;color:var(--text-3);font:12px var(--mono);padding:0 8px}
.gap:before,.gap:after{content:"";flex:1;height:1px;margin:0 10px;background:var(--stroke-2);opacity:.6}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;border-radius:var(--r-lg)}
.empty .ico{font-size:42px;margin-bottom:10px}
.empty b{font-size:17px}
.empty p{margin:6px 0 0;color:var(--text-2);font-size:13.5px;max-width:280px}
.next-hint{margin:12px 4px 0;font-size:12.5px;color:var(--text-2);text-align:center}
.next-hint b{color:var(--accent-2)}

/* Нижняя панель */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;background:rgba(3,5,12,.6);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.overlay.open{opacity:1;visibility:visible}
.sheet{--c:var(--other);--c-rgb:var(--other-rgb);position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:88%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:10px 18px 22px;padding-bottom:calc(var(--safe-bottom) + 22px);border-radius:26px 26px 0 0;
  background:var(--card-solid);border-top:1px solid var(--stroke-2);box-shadow:0 -10px 40px -10px rgba(0,0,0,.6);
  transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.2,1),visibility 0s .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.2,1),visibility 0s}
.sheet.dragging{transition:none}
.sheet.lec{--c:var(--lec);--c-rgb:var(--lec-rgb)}.sheet.prac{--c:var(--prac);--c-rgb:var(--prac-rgb)}.sheet.lab{--c:var(--lab);--c-rgb:var(--lab-rgb)}
.sheet:before{content:"";position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0,rgba(var(--c-rgb),.22),transparent 70%)}
.grabber{width:42px;height:5px;border-radius:5px;background:var(--stroke-2);margin:2px auto 16px}
.sheet .tag{padding:5px 11px;border-radius:99px;font-size:12px;background:rgba(var(--c-rgb),.14);border:1px solid rgba(var(--c-rgb),.35)}
.sheet h2{position:relative;margin:12px 0 4px;font-size:21px;line-height:1.2;font-weight:800}
.sheet .topic{position:relative;margin:0 0 4px;color:var(--text-2);font-size:14px}
.rows{position:relative;display:grid;gap:8px;margin-top:16px}
.row{display:flex;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--stroke)}
.row .ri{width:36px;height:36px;margin-right:12px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;
  background:rgba(var(--c-rgb),.15);color:var(--c)}
.row .ri svg{width:18px;height:18px}
.row small{display:block;font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.row b{display:block;font-size:15px;word-break:break-word}
.row.muted b{color:var(--text-3);font-weight:500}
.sheet-actions{position:relative;display:flex;margin-top:16px}
.sheet-actions .btn+.btn{margin-left:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;height:50px;border-radius:var(--r-md);font-weight:800;font-size:15px;text-align:center}
.btn svg{width:18px;height:18px;margin-right:8px}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--glow-2))}
.btn.ghost{background:var(--card-1);border:1px solid var(--stroke)}

#err{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;padding:12px 14px;border-radius:14px;
  background:#3b0d18;color:#ffd5dc;font:12px/1.4 var(--mono);white-space:pre-wrap;-webkit-user-select:text;user-select:text}

@media (max-width:400px){.week-head .title b{font-size:19px}}
@media (max-width:350px){.day-btn .dn{font-size:15px}.lesson .time{width:48px}.hero h1{font-size:26px}.week-head .title b{font-size:17px}.today-btn{padding:8px 9px}}
@media (min-width:640px){.screen,.sheet{max-width:560px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<div id="err"></div>
<script>
// Если что-то сломается, показываем ошибку на экране, а не пустое окно
window.onerror = function (msg, src, line) {
  var box = document.getElementById("err");
  if (box) { box.style.display = "block"; box.textContent = "Ошибка: " + msg + (line ? " (строка " + line + ")" : ""); }
  if (window.__tgReadySent) return;
  try { // всё равно убираем заставку Telegram, чтобы ошибку было видно
    var tgHash = /tgWebAppVersion=/.test(location.hash);
    try { tgHash = tgHash || /tgWebAppVersion/.test(sessionStorage.getItem("tgParams") || ""); } catch (e) {}
    if (window.TelegramWebviewProxy) { window.__tgReadySent = true; window.TelegramWebviewProxy.postEvent("web_app_ready", '""'); }
    else if (tgHash && window.parent && window.parent !== window) {
      window.__tgReadySent = true;
      window.parent.postMessage('{"eventType":"web_app_ready","eventData":""}', "*");
    }
  } catch (e) {}
};
</script>

<script>
(function () {
  "use strict";
  var APP_VERSION = "2.2";

  /* ── Мост к Telegram без внешнего SDK ──
     Тот же протокол, что в официальном telegram-web-app.js: события уходят через

    var dec = function (x) { try { return decodeURIComponent(x.replace(/\+/g, "%20")); } catch (e) { return x; } };

        var i = p.indexOf("=");
        if (i > 0) params[dec(p.slice(0, i))] = dec(p.slice(i + 1));

    } catch (e) {}
    try { // после перезагрузки Telegram не передаёт параметры повторно
      if (params.tgWebAppVersion) sessionStorage.setItem("tgParams", JSON.stringify(params));
      else params = JSON.parse(sessionStorage.getItem("tgParams") || "null") || params;
    } catch (e) {}

    var isIframe = false;
    try { isIframe = window.parent != null && window !== window.parent; } catch (e) {}
    var hasProxy = function () { return typeof window.TelegramWebviewProxy !== "undefined"; };
    var hasNotify = function () { try { return !!(window.external && "notify" in window.external); } catch (e) { return false; } };
    var version = params.tgWebAppVersion || "6.0";
    var handlers = {};

    function atLeast(v) {
      var a = version.split("."), b = v.split(".");
      for (var i = 0; i < Math.max(a.length, b.length); i++) {
        var x = parseInt(a[i] || 0, 10), y = parseInt(b[i] || 0, 10);
        if (x !== y) return x > y;
      }
      return true;
    }
    function post(type, data) {
      if (data === undefined) data = "";
      try {
        if (hasProxy()) window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data));
        else if (hasNotify()) window.external.notify(JSON.stringify({ eventType: type, eventData: data }));
        else if (isIframe) window.parent.postMessage(JSON.stringify({ eventType: type, eventData: data }), "*");

    }
    function receive(type, data) {
      (handlers[type] || []).forEach(function (fn) { try { fn(data); } catch (e) {} });
    }
    window.Telegram = window.Telegram || {};
    window.Telegram.WebView = window.Telegram.WebView || {};

    window.TelegramGameProxy = { receiveEvent: receive };

        try { d = JSON.parse(ev.data); } catch (e) { return; }

  };

  /* ── Данные ── */
  var GROUPS = {}, dataError = "";
  try { GROUPS = JSON.parse(document.getElementById("schedule-data").textContent).groups || {}; }
  catch (e) { dataError = String(e && e.message || e); }
  var WEEKDAYS = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
  var DW_SHORT = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  var DW_FULL = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  var MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  var MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  var has = function (o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); };

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  /* ── Даты ── */
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var iso = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var startOfDay = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  var addDays = function (d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); };
  var dayIdx = function (d) { return (d.getDay() + 6) % 7; }; // 0 = понедельник
  var mondayOf = function (d) { return addDays(d, -dayIdx(d)); };
  var sameDay = function (a, b) { return iso(a) === iso(b); };
  var today = function () { return startOfDay(new Date()); };
  var splitTime = function (t) { return String(t || "").split(/[-–—]/).map(function (s) { return s.trim(); }); };

  var nowMin = function () { var n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
  var short3 = function (m) { return MONTHS_GEN[m].slice(0, 3); };

    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
    return many;
  };
  var fmtDur = function (m) {
    var h = Math.floor(m / 60), r = m % 60;
    return (h ? h + " ч" : "") + (h && r ? " " : "") + (r || !h ? r + " мин" : "");
  };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

  };
  var typeClass = function (t) {
    var s = String(t || "").toLowerCase();
    if (s.indexOf("лек") === 0) return "lec";
    if (s.indexOf("прак") === 0 || s === "пз" || s.indexOf("сем") === 0) return "prac";
    if (s.indexOf("лаб") === 0) return "lab";

  };

  // Пары на дату: сначала точная дата, затем повторяющаяся неделя
  function getDay(name, date) {
    var g = GROUPS[name] || {}, key = iso(date), wd = WEEKDAYS[dayIdx(date)], list;
    if (has(g.dates, key)) list = g.dates[key];
    else if (g.weekly) list = g.weekly[wd] || [];

    list = (list || []).slice().sort(function (a, b) { return toMin(splitTime(a.time)[0]) - toMin(splitTime(b.time)[0]); });
    return { lessons: list, status: list.length ? "ok" : "free" };
  }

  function groupStats(name) {
    var g = GROUPS[name];
    if (g.weekly) {
      var n = WEEKDAYS.reduce(function (s, d) { return s + (g.weekly[d] || []).length; }, 0);
      return n + " " + plural(n, "пара", "пары", "пар") + " в неделю";
    }

    return "по датам · " + f(days[0]) + " – " + f(days[days.length - 1]);
  }

  var state = {
    group: has(GROUPS, store.get("sched.group")) ? store.get("sched.group") : null,
    date: today(),
    theme: store.get("sched.theme") === "light" ? "light" : "dark",
    sheetOpen: false,
    lessons: [],
  };

  var I = {
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',

    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>',
  };

  var $ = function (id) { return document.getElementById(id); };
  var el = {};
  ["picker", "schedule", "groupList", "ver", "chipName", "chipDot", "groupChip", "themeBtn", "monthLabel", "weekLabel",
    "todayBtn", "prevWeek", "nextWeek", "weekStrip", "indicator", "viewport", "overlay", "sheet"].forEach(function (id) { el[id] = $(id); });
  var isHidden = function (node) { return node.classList.contains("hidden"); };

  /* ── Тема ── */
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.theme);
    el.themeBtn.innerHTML = state.theme === "dark" ? I.sun : I.moon;
    var bg = state.theme === "dark" ? "#07090f" : "#eef1fb";
    document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
    if (!TG.available()) return;
    if (TG.atLeast("6.9")) TG.post("web_app_set_header_color", { color: bg });
    if (TG.atLeast("6.1")) TG.post("web_app_set_background_color", { color: bg });
    if (TG.atLeast("7.10")) TG.post("web_app_set_bottom_bar_color", { color: bg });
  }
  el.themeBtn.addEventListener("click", function () {
    state.theme = state.theme === "dark" ? "light" : "dark";
    store.set("sched.theme", state.theme);
    applyTheme();
    haptic.tap();
  });

  /* ── Выбор группы ── */
  function renderPicker() {
    if (!Object.keys(GROUPS).length) {
      el.groupList.innerHTML = '<div class="empty glass"><div class="ico">⚠️</div><b>Нет данных расписания</b><p>' +
        (dataError ? "В JSON с расписанием ошибка: " + esc(dataError) : "В JSON с расписанием нет ни одной группы.") + "</p></div>";
      return;
    }
    el.groupList.innerHTML = Object.keys(GROUPS).map(function (name, i) {
      return '<button class="group-card glass' + (name === state.group ? " current" : "") + '" data-group="' + esc(name) +
        '" style="animation-delay:' + i * 60 + 'ms"><span class="badge">' + esc(name) + '</span><span class="meta"><b>' + esc(name) +
        "</b><span>" + esc(GROUPS[name].subtitle || "") + "</span><em>" + esc(groupStats(name)) + '</em></span><span class="chev">' + I.chev + "</span></button>";
    }).join("");
  }
  el.groupList.addEventListener("click", function (e) {
    var card = e.target.closest("[data-group]");
    if (!card) return;
    haptic.tap();
    state.group = card.getAttribute("data-group");
    store.set("sched.group", state.group);
    showSchedule();
  });
  function showPicker() {
    renderPicker();
    el.picker.classList.remove("hidden");
    el.schedule.classList.add("hidden");
    updateBackButton();
  }
  function showSchedule() {
    el.chipName.textContent = state.group;
    el.chipDot.textContent = state.group.replace(/[^A-Za-zА-Яа-яЁё]/g, "").slice(0, 2).toUpperCase();
    el.picker.classList.add("hidden");
    el.schedule.classList.remove("hidden");
    renderWeek();
    renderDay(0);
    updateBackButton();
  }
  el.groupChip.addEventListener("click", function () { haptic.tap(); showPicker(); });

  /* ── Неделя ── */
  function renderWeek() {
    var mon = mondayOf(state.date), sun = addDays(mon, 6), t = today();
    el.monthLabel.textContent = mon.getMonth() === sun.getMonth()
      ? MONTHS[sun.getMonth()] + " " + sun.getFullYear()
      : MONTHS[mon.getMonth()].slice(0, 3) + " – " + MONTHS[sun.getMonth()].slice(0, 3).toLowerCase() + " " + sun.getFullYear();
    var diff = Math.round((mon - mondayOf(t)) / 6048e5);
    var rel = diff === 0 ? "текущая" : diff === 1 ? "следующая" : diff === -1 ? "прошлая" : (diff > 0 ? "+" : "") + diff + " нед.";
    el.weekLabel.textContent = (mon.getMonth() === sun.getMonth()
      ? mon.getDate() + "–" + sun.getDate() + " " + short3(sun.getMonth())
      : mon.getDate() + " " + short3(mon.getMonth()) + " – " + sun.getDate() + " " + short3(sun.getMonth())) + " · " + rel;
    el.todayBtn.hidden = sameDay(state.date, t);

    var html = "";
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), day = getDay(state.group, d);
      var pips = day.status === "ok" ? day.lessons.slice(0, 6).map(function (l) { return '<i class="' + typeClass(l.type) + '"></i>'; }).join("") : "";
      html += '<button class="day-btn' + (sameDay(d, t) ? " is-today" : "") + (sameDay(d, state.date) ? " active" : "") +
        '" data-date="' + iso(d) + '" aria-label="' + DW_FULL[i] + ", " + d.getDate() + " " + MONTHS_GEN[d.getMonth()] + '"><span class="dw">' +
        DW_SHORT[i] + '</span><span class="dn">' + d.getDate() + '</span><span class="pips">' + pips + "</span></button>";
    }
    var old = el.weekStrip.querySelectorAll(".day-btn");
    for (var j = 0; j < old.length; j++) old[j].parentNode.removeChild(old[j]);
    el.weekStrip.insertAdjacentHTML("beforeend", html);
    moveIndicator();
  }
  function moveIndicator() {
    var active = el.weekStrip.querySelector(".day-btn.active");
    if (!active) return;
    el.indicator.style.width = active.offsetWidth + "px";
    el.indicator.style.transform = "translateX(" + active.offsetLeft + "px)";
  }
  window.addEventListener("resize", moveIndicator);

  el.weekStrip.addEventListener("click", function (e) {
    var b = e.target.closest(".day-btn");
    if (!b) return;
    var p = b.getAttribute("data-date").split("-");
    goTo(new Date(+p[0], +p[1] - 1, +p[2]));
  });
  el.prevWeek.addEventListener("click", function () { goTo(addDays(state.date, -7)); });
  el.nextWeek.addEventListener("click", function () { goTo(addDays(state.date, 7)); });
  el.todayBtn.addEventListener("click", function () { goTo(today()); });

  function goTo(date) {
    date = startOfDay(date);
    if (sameDay(date, state.date)) return;
    var dir = date > state.date ? 1 : -1;
    var weekChanged = !sameDay(mondayOf(date), mondayOf(state.date));
    state.date = date;
    haptic.select();
    if (weekChanged) renderWeek();
    else {
      var btns = el.weekStrip.querySelectorAll(".day-btn");
      for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("active", btns[i].getAttribute("data-date") === iso(date));
      el.todayBtn.hidden = sameDay(date, today());
      moveIndicator();
    }
    renderDay(dir);
  }

  /* ── День ── */
  function lessonHTML(l, i, isToday, now) {
    var t = splitTime(l.time), s = t[0], e = t[1] || "";
    var sMin = toMin(s), eMin = e ? toMin(e) : sMin;
    var mode = "", extra = "";
    if (isToday && now >= eMin) mode = "past";
    if (isToday && now >= sMin && now < eMin) {
      mode = "now";
      extra = '<div class="progress"><i style="width:' + Math.round((now - sMin) / (eMin - sMin) * 100) + '%"></i></div>' +
        '<div class="progress-label"><span>идёт ' + fmtDur(now - sMin) + "</span><span>до конца " + fmtDur(eMin - now) + "</span></div>";
    }
    var info = (l.room ? "<span>" + I.pin + esc(l.room) + "</span>" : "") + (l.teacher ? "<span>" + I.user + esc(l.teacher) + "</span>" : "");
    return '<button class="lesson glass ' + typeClass(l.type) + " " + mode + '" data-i="' + i + '"><span class="time"><span class="n">' +
      (l.num ? esc(l.num) + " пара" : "") + '</span><span class="s">' + esc(s) + '</span><span class="e">' + esc(e) + '</span></span><span class="body"><span class="tag">' +
      esc(l.type || "занятие") + "</span>" + (mode === "now" ? '<span class="live">сейчас</span>' : "") + "<h3>" + esc(l.subject) +
      '</h3><span class="info">' + info + "</span></span>" + extra + "</button>";
  }

  function dayHTML() {
    var d = state.date, isToday = sameDay(d, today()), now = nowMin();
    var day = getDay(state.group, d), lessons = day.lessons;
    state.lessons = lessons;
    var head = DW_FULL[dayIdx(d)] + ", " + d.getDate() + " " + MONTHS_GEN[d.getMonth()];
    if (day.status !== "ok") {
      var sunday = dayIdx(d) === 6, c;
      if (day.status === "free") c = sunday ? ["🌙", "Выходной", "Воскресенье, пар нет."] : ["☕", "Пар нет", "В этот день занятий не стоит."];
      else c = sunday ? ["🌙", "Выходной", "На воскресенье расписания нет."] : ["🛰️", "Нет данных", "Расписание на эту дату ещё не добавлено."];
      return '<div class="day-summary"><b>' + head + '</b></div><div class="empty glass"><div class="ico">' + c[0] + "</div><b>" + c[1] + "</b><p>" + c[2] + "</p></div>";
    }
    var first = splitTime(lessons[0].time)[0], last = splitTime(lessons[lessons.length - 1].time)[1] || "";
    var html = '<div class="day-summary"><b>' + head + '</b><span class="mono">' + lessons.length + " " + plural(lessons.length, "пара", "пары", "пар") +
      " · " + esc(first) + "–" + esc(last) + '</span></div><div class="lessons">';
    lessons.forEach(function (l, i) {
      if (i > 0) {
        var prevEnd = splitTime(lessons[i - 1].time)[1];
        var gap = prevEnd ? toMin(splitTime(l.time)[0]) - toMin(prevEnd) : 0;
        if (gap >= 40) html += '<div class="gap">окно ' + fmtDur(gap) + "</div>";
      }
      html += lessonHTML(l, i, isToday, now);
    });
    html += "</div>";
    if (isToday) {
      var running = lessons.some(function (l) { var t = splitTime(l.time); return now >= toMin(t[0]) && t[1] && now < toMin(t[1]); });
      var next = lessons.filter(function (l) { return toMin(splitTime(l.time)[0]) > now; })[0];
      if (last && now >= toMin(last)) html += '<div class="next-hint">На сегодня всё 🎉</div>';
      else if (next && !running) html += '<div class="next-hint">Следующая пара через <b>' + fmtDur(toMin(splitTime(next.time)[0]) - now) + "</b></div>";
    }
    return html;
  }

  function renderDay(dir) {
    var old = el.viewport.querySelector(".day-pane:not(.leaving)");
    var pane = document.createElement("div");
    pane.className = "day-pane";
    pane.innerHTML = dayHTML();
    if (!dir) pane.classList.add("stagger");
    var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    if (old && dir && !reduce) {
      old.classList.add("leaving", dir > 0 ? "out-l" : "out-r");
      old.style.transition = "none"; // уходит с того места, где его отпустил палец
      setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 230);
      pane.classList.add(dir > 0 ? "in-r" : "in-l");
    } else if (old) {
      old.parentNode.removeChild(old);
    }
    el.viewport.appendChild(pane);
  }

  // смена дня (приложение могло быть открыто через полночь)
  var lastDay = iso(today());
  function checkDay() {
    var t = today();
    if (iso(t) === lastDay) return false;
    var moved = iso(state.date) === lastDay;
    if (moved) state.date = t;
    lastDay = iso(t);
    if (isHidden(el.schedule)) return true;
    renderWeek();
    var pane = el.viewport.querySelector(".day-pane:not(.leaving)");
    if (moved || !pane) renderDay(0);
    else { var top = pane.scrollTop; pane.classList.remove("stagger"); pane.innerHTML = dayHTML(); pane.scrollTop = top; }
    return true;
  }
  // раз в 30 секунд обновляем «идёт сейчас», если открыт сегодняшний день
  setInterval(function () {
    if (document.hidden || checkDay()) return;
    if (isHidden(el.schedule) || state.sheetOpen || !sameDay(state.date, today())) return;
    var pane = el.viewport.querySelector(".day-pane:not(.leaving)");
    if (!pane) return;
    var top = pane.scrollTop;
    pane.classList.remove("stagger");
    pane.innerHTML = dayHTML();
    pane.scrollTop = top;
  }, 30000);
  // свёрнутое приложение не анимирует фон; при возврате проверяем дату
  function setVisible(visible) {
    document.documentElement.classList.toggle("paused", !visible);
    if (visible) checkDay();
  }
  document.addEventListener("visibilitychange", function () { setVisible(!document.hidden); });
  TG.on("visibility_changed", function (d) { if (d) setVisible(!!d.is_visible); });

  /* ── Свайпы по дням ── */
  (function () {
    var x0 = 0, y0 = 0, dx = 0, tracking = false, horiz = null, pane = null;
    el.viewport.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; tracking = true; horiz = null;
      pane = el.viewport.querySelector(".day-pane:not(.leaving)");
    }, { passive: true });
    el.viewport.addEventListener("touchmove", function (e) {
      if (!tracking || !pane) return;
      var mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
      if (horiz === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) horiz = Math.abs(mx) > Math.abs(my) * 1.2;
      if (!horiz) return;
      dx = mx;
      pane.style.transition = "none";
      pane.style.transform = "translateX(" + dx * 0.6 + "px)";
    }, { passive: true });
    function end() {
      if (!tracking) return;
      tracking = false;
      if (!pane) return;
      pane.style.transition = "transform .25s ease-out";
      if (horiz && Math.abs(dx) > 60) goTo(addDays(state.date, dx < 0 ? 1 : -1));
      else pane.style.transform = "";
    }
    el.viewport.addEventListener("touchend", end);
    el.viewport.addEventListener("touchcancel", end);
    document.addEventListener("keydown", function (e) {
      if (state.sheetOpen) { if (e.key === "Escape") closeSheet(); return; }
      if (isHidden(el.schedule)) return;
      if (e.key === "ArrowRight") goTo(addDays(state.date, 1));
      if (e.key === "ArrowLeft") goTo(addDays(state.date, -1));
    });
  })();

  /* ── Нижняя панель ── */
  el.viewport.addEventListener("click", function (e) {
    var card = e.target.closest(".lesson");
    if (card && state.lessons[+card.getAttribute("data-i")]) openSheet(state.lessons[+card.getAttribute("data-i")]);
  });
  function row(icon, label, value) {
    var empty = value == null || String(value).trim() === "";
    return '<div class="row' + (empty ? " muted" : "") + '"><span class="ri">' + icon + "</span><span><small>" + label + "</small><b>" +
      (empty ? "не указано" : esc(value)) + "</b></span></div>";
  }
  function openLink(url) {
    if (TG.available() && TG.atLeast("6.1")) TG.post("web_app_open_link", { url: url });
    else window.open(url, "_blank");
  }
  function openSheet(l) {
    haptic.tap();
    var t = splitTime(l.time), s = t[0], e = t[1] || "", dur = e ? toMin(e) - toMin(s) : 0, d = state.date;
    var raw = String(l.link || "").trim();
    var link = /^https?:\/\//i.test(raw) ? raw : /^[^\s\/:?#.]+(\.[^\s\/:?#.]+)+([\/?#:]|$)/.test(raw) ? "https://" + raw : "";
    if (link) { // нормализуем как официальный SDK: пробелы и кириллица кодируются
      var a = document.createElement("a");
      a.href = link;
      link = /^https?:$/.test(a.protocol) ? a.href : "";
    }
    el.sheet.className = "sheet " + typeClass(l.type);
    el.sheet.innerHTML = '<div class="grabber"></div><span class="tag">' + esc(l.type || "занятие") + "</span><h2>" + esc(l.subject) + "</h2>" +
      (l.topic ? '<p class="topic">' + esc(l.topic) + "</p>" : "") + '<div class="rows">' +
      row(I.clock, "Время", s + (e ? " – " + e : "") + (dur > 0 ? " · " + dur + " мин" : "")) +
      row(I.cal, "Дата", DW_FULL[dayIdx(d)] + ", " + d.getDate() + " " + MONTHS_GEN[d.getMonth()] + (l.num ? " · " + l.num + " пара" : "")) +
      row(I.user, "Преподаватель", l.teacher) + row(I.pin, "Аудитория", l.room) +
      (link ? row(I.link, "Материалы", link.replace(/^https?:\/\//i, "")) : "") +
      '</div><div class="sheet-actions">' + (link ? '<button class="btn primary" id="openLink">' + I.book + "Материалы</button>" : "") +
      '<button class="btn ' + (link ? "ghost" : "primary") + '" id="closeSheet">Закрыть</button></div>';
    el.sheet.scrollTop = 0;
    el.sheet.style.transform = "";
    el.sheet.classList.add("open");
    el.overlay.classList.add("open");
    state.sheetOpen = true;
    updateBackButton();
    $("closeSheet").onclick = closeSheet;
    if (link) $("openLink").onclick = function () { openLink(link); };
  }
  function closeSheet() {
    el.sheet.classList.remove("open");
    el.overlay.classList.remove("open");
    el.sheet.style.transform = "";
    state.sheetOpen = false;
    updateBackButton();
  }
  el.overlay.addEventListener("click", closeSheet);
  (function () { // свайп панели вниз закрывает её
    var y0 = 0, dy = 0, drag = false;
    el.sheet.addEventListener("touchstart", function (e) {
      if (el.sheet.scrollTop > 0) return;
      y0 = e.touches[0].clientY; dy = 0; drag = true;
    }, { passive: true });
    el.sheet.addEventListener("touchmove", function (e) {
      if (!drag) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      if (dy > 0) { el.sheet.classList.add("dragging"); el.sheet.style.transform = "translateY(" + dy + "px)"; }
    }, { passive: true });
    el.sheet.addEventListener("touchend", function () {
      if (!drag) return;
      drag = false;
      el.sheet.classList.remove("dragging");
      if (dy > 110) closeSheet(); else el.sheet.style.transform = "";
    });
  })();

  /* ── Кнопка «Назад» Telegram ── */
  var backVisible = null;
  function updateBackButton() {
    if (!TG.available() || !TG.atLeast("6.1")) return;
    var need = state.sheetOpen || (!isHidden(el.picker) && !!state.group);
    if (need === backVisible) return;
    backVisible = need;
    TG.post("web_app_setup_back_button", { is_visible: need });
  }
  TG.on("back_button_pressed", function () {
    if (state.sheetOpen) closeSheet();
    else if (state.group) showSchedule();
  });

  /* ── Безопасные зоны Telegram (вырез, кнопки поверх приложения) ── */
  function insets(top, bottom) {
    return function (d) {
      if (!d) return;
      var r = document.documentElement.style;
      if (d.top != null) r.setProperty(top, (+d.top || 0) + "px");
      if (d.bottom != null) r.setProperty(bottom, (+d.bottom || 0) + "px");
    };
  }
  TG.on("safe_area_changed", insets("--tg-sa-top", "--tg-sa-bottom"));       // вырез и системные панели
  TG.on("content_safe_area_changed", insets("--tg-top", "--tg-bottom"));     // кнопки Telegram в полноэкранном режиме

  /* ── Старт: сначала рисуем, после первого кадра сообщаем Telegram, что готовы ── */
  var started = false;
  function signalReady() {
    document.documentElement.classList.remove("boot"); // первый кадр уже нарисован, включаем переходы
    if (started || !TG.available()) return;
    started = true;
    if (!window.__tgReadySent) { window.__tgReadySent = true; TG.post("web_app_ready"); }
    TG.post("web_app_expand");
    if (TG.atLeast("7.7")) TG.post("web_app_setup_swipe_behavior", { allow_vertical_swipe: false });
    if (TG.atLeast("8.0")) { TG.post("web_app_request_safe_area"); TG.post("web_app_request_content_safe_area"); }
  }
  try {
    // на слабых устройствах фон не анимируем
    if ((navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || (navigator.deviceMemory && navigator.deviceMemory <= 2))
      document.documentElement.classList.add("lite");
    el.ver.textContent = "версия " + APP_VERSION;
    applyTheme();
    if (state.group) showSchedule(); else showPicker();
  } finally {
    if (window.requestAnimationFrame) requestAnimationFrame(function () { setTimeout(signalReady, 0); });
    setTimeout(signalReady, 300); // на случай, если кадры не рисуются (окно ещё скрыто)
  }
})();
</script>
</body>
</html>
